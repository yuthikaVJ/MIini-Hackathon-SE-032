version: "3.8"

services:
  backend:
    image: yuthikavj31545/minihackathon-backend:latest
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI}

  frontend:
    image: yuthikavj31545/minihackathon-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always